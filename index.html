<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

  <meta name="description" content="Divide la cuenta fácilmente entre amigos">

  <title>La Dolorosa</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- TOAST -->
<div id="toast"></div>

<!-- MODAL -->
<div id="modal-overlay">
  <div class="modal-box">
    <p class="modal-title" id="modal-title"></p>
    <p class="modal-msg"   id="modal-msg"></p>
    <input  class="modal-input" id="modal-input" type="text">
    <p class="modal-error" id="modal-error"></p>
    <div class="modal-actions">
      <button class="modal-btn modal-btn-cancel"  id="modal-cancel">Cancelar</button>
      <button class="modal-btn modal-btn-confirm" id="modal-confirm">Confirmar</button>
    </div>
  </div>
</div>

<!-- LANDING -->
<div id="landing-page">
  <div class="landing-content" id="pin-screen">
    <span class="landing-logo">🔑</span>
    <h1 class="landing-title">La Dolorosa</h1>
    <p style="color:var(--muted);margin-bottom:20px;font-size:15px;">Introduce el PIN para acceder</p>
    <input type="password" id="pin-input" class="editor-input" placeholder="PIN de acceso" aria-label="PIN de acceso"
      style="width:100%;padding:16px;font-size:18px;text-align:center;border-radius:16px;border:2px solid var(--border);margin-bottom:12px;"
      onkeydown="if(event.key==='Enter') checkPin()">
    <button onclick="checkPin()"
      style="width:100%;padding:16px;background:var(--primary);color:white;border:none;border-radius:16px;font-size:17px;font-weight:800;cursor:pointer;">
      Entrar
    </button>
    <p id="pin-error" style="color:var(--danger);margin-top:12px;font-weight:700;display:none;">PIN incorrecto, inténtalo de nuevo</p>
  </div>
  <div class="landing-content" id="venue-screen" style="display:none;">
    <span class="landing-logo">
      <svg viewBox="0 0 200 100" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <g transform="translate(70,50)">
          <path d="M0,0 C-9,-5 -25,-4 -36,3 C-25,4 -9,4 0,0 Z" transform="rotate(-34)" fill="#f59e0b" opacity="0.7"/>
          <path d="M0,0 C-11,-6 -30,-5 -42,1 C-30,5 -11,5 0,0 Z" transform="rotate(-17)" fill="#fbbf24" opacity="0.85"/>
          <path d="M0,0 C-12,-6 -34,-5 -47,0 C-34,5 -12,5 0,0 Z" fill="#f59e0b"/>
          <path d="M0,0 C-11,-5 -30,-4 -42,-1 C-30,-5 -11,-5 0,0 Z" transform="rotate(17)" fill="#fbbf24" opacity="0.85"/>
          <path d="M0,0 C-9,-4 -25,-3 -36,-3 C-25,-4 -9,-4 0,0 Z" transform="rotate(34)" fill="#f59e0b" opacity="0.7"/>
        </g>
        <g transform="translate(130,50) scale(-1,1)">
          <path d="M0,0 C-9,-5 -25,-4 -36,3 C-25,4 -9,4 0,0 Z" transform="rotate(-34)" fill="#f59e0b" opacity="0.7"/>
          <path d="M0,0 C-11,-6 -30,-5 -42,1 C-30,5 -11,5 0,0 Z" transform="rotate(-17)" fill="#fbbf24" opacity="0.85"/>
          <path d="M0,0 C-12,-6 -34,-5 -47,0 C-34,5 -12,5 0,0 Z" fill="#f59e0b"/>
          <path d="M0,0 C-11,-5 -30,-4 -42,-1 C-30,-5 -11,-5 0,0 Z" transform="rotate(17)" fill="#fbbf24" opacity="0.85"/>
          <path d="M0,0 C-9,-4 -25,-3 -36,-3 C-25,-4 -9,-4 0,0 Z" transform="rotate(34)" fill="#f59e0b" opacity="0.7"/>
        </g>
        <rect x="70" y="32" width="60" height="36" rx="7" fill="#4f46e5" stroke="#3730a3" stroke-width="2"/>
        <circle cx="100" cy="50" r="13" fill="#ffffff" opacity="0.18"/>
        <text x="100" y="51" text-anchor="middle" dominant-baseline="central" font-family="Inter, Arial, sans-serif" font-weight="900" font-size="20" fill="#ffffff">€</text>
      </svg>
    </span>
    <h1 class="landing-title">¿Dónde estamos?</h1>
    <button class="venue-btn" onclick="startApp('aiur')"    aria-label="Club Ciclista Irunés"><span>Club Ciclista Irunés</span><span>🚴</span></button>
    <button class="venue-btn" onclick="startApp('ekhi')"    aria-label="La Salle">
      <span>La Salle</span>
      <span>
        <svg viewBox="0 0 100 70" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <path d="M22 34 Q50 58 78 34 L78 44 Q50 66 22 44 Z" fill="#3730a3"/>
          <path d="M50 10 L94 30 L50 50 L6 30 Z" fill="#4f46e5"/>
          <path d="M50 30 C54 38 54 48 50 56" stroke="#f59e0b" stroke-width="3" fill="none" stroke-linecap="round"/>
          <circle cx="50" cy="58" r="4.5" fill="#f59e0b"/>
        </svg>
      </span>
    </button>
    <button class="venue-btn" onclick="startApp('galarza')" aria-label="Atsegiña">
      <span>Atsegiña</span>
      <span>
        <svg viewBox="0 0 100 80" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <rect x="18" y="56" width="6" height="18" fill="#78350f"/>
          <rect x="76" y="56" width="6" height="18" fill="#78350f"/>
          <circle cx="28" cy="28" r="9" fill="#4f46e5"/>
          <rect x="19" y="36" width="18" height="16" rx="6" fill="#4f46e5"/>
          <circle cx="50" cy="23" r="9" fill="#f59e0b"/>
          <rect x="41" y="31" width="18" height="18" rx="6" fill="#f59e0b"/>
          <circle cx="72" cy="28" r="9" fill="#10b981"/>
          <rect x="63" y="36" width="18" height="16" rx="6" fill="#10b981"/>
          <rect x="10" y="46" width="80" height="10" rx="3" fill="#92400e"/>
          <ellipse cx="28" cy="45" rx="7" ry="2.5" fill="#ffffff" stroke="#e2e8f0"/>
          <ellipse cx="50" cy="41" rx="7" ry="2.5" fill="#ffffff" stroke="#e2e8f0"/>
          <ellipse cx="72" cy="45" rx="7" ry="2.5" fill="#ffffff" stroke="#e2e8f0"/>
        </svg>
      </span>
    </button>
  </div>
</div>

<!-- APP -->
<div id="app-container">
  <header>
    <div class="logo-container" onclick="goBack()" role="button" aria-label="Volver al inicio">
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="back-arrow">
        <line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/>
      </svg>
      <span class="logo-icon">
        <svg viewBox="0 0 200 100" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <g transform="translate(70,50)">
            <path d="M0,0 C-9,-5 -25,-4 -36,3 C-25,4 -9,4 0,0 Z" transform="rotate(-34)" fill="#f59e0b" opacity="0.7"/>
            <path d="M0,0 C-11,-6 -30,-5 -42,1 C-30,5 -11,5 0,0 Z" transform="rotate(-17)" fill="#fbbf24" opacity="0.85"/>
            <path d="M0,0 C-12,-6 -34,-5 -47,0 C-34,5 -12,5 0,0 Z" fill="#f59e0b"/>
            <path d="M0,0 C-11,-5 -30,-4 -42,-1 C-30,-5 -11,-5 0,0 Z" transform="rotate(17)" fill="#fbbf24" opacity="0.85"/>
            <path d="M0,0 C-9,-4 -25,-3 -36,-3 C-25,-4 -9,-4 0,0 Z" transform="rotate(34)" fill="#f59e0b" opacity="0.7"/>
          </g>
          <g transform="translate(130,50) scale(-1,1)">
            <path d="M0,0 C-9,-5 -25,-4 -36,3 C-25,4 -9,4 0,0 Z" transform="rotate(-34)" fill="#f59e0b" opacity="0.7"/>
            <path d="M0,0 C-11,-6 -30,-5 -42,1 C-30,5 -11,5 0,0 Z" transform="rotate(-17)" fill="#fbbf24" opacity="0.85"/>
            <path d="M0,0 C-12,-6 -34,-5 -47,0 C-34,5 -12,5 0,0 Z" fill="#f59e0b"/>
            <path d="M0,0 C-11,-5 -30,-4 -42,-1 C-30,-5 -11,-5 0,0 Z" transform="rotate(17)" fill="#fbbf24" opacity="0.85"/>
            <path d="M0,0 C-9,-4 -25,-3 -36,-3 C-25,-4 -9,-4 0,0 Z" transform="rotate(34)" fill="#f59e0b" opacity="0.7"/>
          </g>
          <rect x="70" y="32" width="60" height="36" rx="7" fill="#4f46e5" stroke="#3730a3" stroke-width="2"/>
          <circle cx="100" cy="50" r="13" fill="#ffffff" opacity="0.18"/>
          <text x="100" y="51" text-anchor="middle" dominant-baseline="central" font-family="Inter, Arial, sans-serif" font-weight="900" font-size="20" fill="#ffffff">€</text>
        </svg>
      </span>
      <h1 style="font-size:1.2rem;line-height:1;">La <span style="color:var(--text)">Dolorosa</span></h1>
    </div>
    <div class="header-actions">
      <button id="btnHistory" class="btn-edit-toggle" onclick="openHistory()" aria-label="Ver historial">
  <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24"
       fill="none" stroke="currentColor" stroke-width="2.5"
       stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="10"/>
    <polyline points="12 6 12 12 16 14"/>
  </svg>
</button>
      <button id="btnEditMode" class="btn-edit-toggle" onclick="toggleAdminMode()" aria-label="Activar modo edición">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"/>
        </svg>
      </button>
      <div class="total-badge" aria-live="polite">
        <small>A PAGAR</small>
        <div id="headerTotal">0.00€</div>
      </div>
    </div>
  </header>
  <div class="container">
    <div class="nav-scroll" id="navContainer" role="tablist"></div>
    <div id="views"></div>
  </div>
  <div class="fab-container hidden" id="actionButtons">
    <button class="fab-btn fab-copy" id="btnCopy" onclick="copyBill()" aria-label="Copiar resumen"><span>📋 Copiar</span></button>
    <button class="fab-btn fab-share" onclick="shareNative()" aria-label="Compartir resumen">
      <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/>
        <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/>
      </svg>
      <span>Compartir</span>
    </button>
  </div>
</div>

  <script type="module" src="app.js"></script>

  <!-- Overlay oscuro -->
  <div id="history-overlay" onclick="closeHistory()"></div>

  <!-- Cajón deslizante -->
  <div id="history-drawer" role="dialog" aria-label="Historial de cuentas">
    <div class="hist-handle"></div>
    <div class="hist-drawer-header">
      <div>
        <h2 class="hist-drawer-title">Historial</h2>
        <p class="hist-drawer-sub" id="hist-venue-label"></p>
      </div>
      <button class="hist-close-btn" onclick="closeHistory()" aria-label="Cerrar historial">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24"
             fill="none" stroke="currentColor" stroke-width="2.5"
             stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"/>
          <line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>
    </div>
    <div id="history-content"></div>
  </div>
</body>
</html>
