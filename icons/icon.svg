<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Background rounded square -->
  <rect width="512" height="512" rx="100" fill="#4f46e5"/>

  <!-- Receipt / ticket shape -->
  <rect x="140" y="90" width="232" height="290" rx="14" fill="white" opacity="0.97"/>

  <!-- Zigzag bottom of receipt (ticket cut) -->
  <polyline points="140,380 156,365 172,380 188,365 204,380 220,365 236,380 252,365 268,380 284,365 300,380 316,365 332,380 348,365 364,380 372,380 372,90 140,90"
    fill="white" opacity="0.97"/>

  <!-- Euro symbol, centered -->
  <text x="256" y="300" font-family="'Arial', sans-serif" font-size="148" font-weight="900"
        fill="#4f46e5" text-anchor="middle" dominant-baseline="auto">€</text>

  <!-- Top decorative lines (like a receipt header) -->
  <rect x="170" y="120" width="172" height="12" rx="6" fill="#4f46e5" opacity="0.18"/>
  <rect x="185" y="142" width="142" height="10" rx="5" fill="#4f46e5" opacity="0.12"/>

  <!-- Bottom area lines (like receipt items) -->
  <rect x="170" y="320" width="100" height="9" rx="4" fill="#4f46e5" opacity="0.18"/>
  <rect x="285" y="320" width="57" height="9" rx="4" fill="#4f46e5" opacity="0.22"/>
  <rect x="170" y="340" width="80" height="9" rx="4" fill="#4f46e5" opacity="0.13"/>
  <rect x="285" y="340" width="57" height="9" rx="4" fill="#4f46e5" opacity="0.16"/>

  <!-- Divider line -->
  <rect x="155" y="358" width="202" height="3" rx="1" fill="#4f46e5" opacity="0.15"/>

  <!-- Sparkle top-right corner -->
  <circle cx="410" cy="102" r="28" fill="white" opacity="0.12"/>
  <circle cx="410" cy="102" r="14" fill="white" opacity="0.18"/>
</svg>
